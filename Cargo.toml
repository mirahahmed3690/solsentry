[package]
name = "solsentry"
version = "0.1.0"
edition = "2021"
description = "Slither for Anchor — an open-source static analyzer for Solana/Anchor programs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
comfy-table = "7"
anyhow = "1"
